version: "1"

services:
  # 1. Authoritative Backend Anti-Cheat & REST API Web Service
  - type: web
    name: bubble-blast-adventure-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GAME_NAME
        value: BUBBLE BLAST ADVENTURE
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ANTI_CHEAT_STRICT_MODE
        value: "true"
      - key: CLIENT_URL
        value: https://bubble-blast-adventure-alpha.vercel.app

  # 2. Production Vite Client Static Site (Render Mirror)
  - type: web
    name: bubble-blast-adventure
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_GAME_NAME
        value: BUBBLE BLAST ADVENTURE
      - key: VITE_API_URL
        value: https://bubble-blast-adventure-ci3t.onrender.com/api
